<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

    let numCircles = prompt("How many circles?");
    const maxRadius = w * 0.45;
    const radiusIncr = maxRadius / numCircles;

    let colours = [
        "red",
        "orange",
        "yellow",
        "green",
        "blue",
        "indigo",
        "violet",
    ];

        let xPos = 300;
        let yPos = 300;

    for (let c = 1; c <= numCircles; c++){
         let radius = radiusIncr * (c + 1);

        ctx.beginPath();
        ctx.arc(xPos,
                yPos,
                radius,
                0,
                Math.PI * 2,
                true);
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.strokeStyle = colours[7 - c];
        ctx.stroke();
    }
    

</script>
